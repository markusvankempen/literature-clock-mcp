services:
  - type: web
    name: literature-clock-mcp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: MCP_MODE=http HOST=0.0.0.0 node src/index.js
    healthCheckPath: /health
    envVars:
      - key: MCP_MODE
        sync: false
        value: http
      - key: HOST
        sync: false
        value: 0.0.0.0
