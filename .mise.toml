[tools]
node = "22"

[tasks.test]
description = "Store smoke check"
run = "node src/smoke.js"

[tasks.test-tools]
description = "Phase 1 in-process plus Phase 2 HTTP wire"
run = "node src/test-tools.js"

[tasks.test-all]
description = "Smoke and the full tool suite"
run = "node src/smoke.js && node src/test-tools.js"

[tasks.http]
description = "HTTP on port 8788"
run = "MCP_MODE=http PORT=8788 node src/index.js"

[tasks.start]
description = "stdio"
run = "MCP_MODE=stdio node src/index.js"
